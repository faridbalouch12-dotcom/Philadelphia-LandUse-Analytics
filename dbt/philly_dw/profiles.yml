philly_dw:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | int }}"
      user: "{{ env_var('POSTGRES_USER', 'philly') }}"
      pass: "{{ env_var('POSTGRES_PASSWORD', 'changeme') }}"
      dbname: "{{ env_var('POSTGRES_DB', 'philly_dw') }}"
      schema: staging
      threads: 4
