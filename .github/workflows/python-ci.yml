name: Python CI

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: philly
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: philly_dw
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Bootstrap database
        env:
          PGPASSWORD: changeme
        run: |
          psql -h localhost -U philly -d philly_dw -f docker/postgres/init/00_extensions.sql
          psql -h localhost -U philly -d philly_dw -f docker/postgres/init/01_schemas.sql

      - name: Run tests
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: philly_dw
          POSTGRES_USER: philly
          POSTGRES_PASSWORD: changeme
        run: pytest tests/
